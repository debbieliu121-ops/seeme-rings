name: Deploy SEEME site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/workflows/static.yml
            /index.html
            /agent.html
            /styles.css
            /agent.css
            /seeme.js
            /agent.js
            /agent-media.mjs
            /agent-pose.mjs
            /agent-report.mjs
            /*.png
          sparse-checkout-cone-mode: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
